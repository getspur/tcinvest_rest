# tcinvest REST → DuckDB table functions (notebook gateway).
# Columns are projected from live REST rows (not the payload blob).
# Nested leftover objects/arrays stay Utf8 JSON text; payload is an escape hatch.
# TCBS OAuth is applied by the localhost facade. Do not put secrets in this file.

[source]
name = "tcinvest"
base_url = "http://127.0.0.1:8788"
auth = { scheme = "none" }

[[table]]
name = "list_tools"
path = "/tools"
response_path = "$.tools"

[table.columns]
name = { json = "$.name", type = "Utf8" }
path = { json = "$.path", type = "Utf8" }
description = { json = "$.description", type = "Utf8" }
