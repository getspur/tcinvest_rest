    "/tools/tcinvest-getLongTermCandleChart": {
      "get": {
        "operationId": "get_long_term_candle_chart",
        "summary": "Returns historical candlestick price bars for a given ticker with Daily, Weekly, or Monthly resolution. Use this to analyze long-term price trends, draw charts, or compute technical indicators over extended periods.\n\nParameters guide:\n- type: Use \"stock\" for listed equities (e.g. TCB, VCB, FPT), \"index\" for market indices (e.g. VNINDEX, HNX, VN30)\n- ticker: The symbol code, max 10 characters\n- resolution: \"D\" for daily bars, \"W\" for weekly bars, \"M\" for monthly bars\n- to: Unix timestamp in seconds of the START date (the most recent date you want data from, inclusive).\n  Example: today is 05-05-2026, Unix timestamp = 1777939200\n- countBack: Number of bars to return going BACKWARDS from the `to` date.\n  Example: to=1777939200 (05-05-2026) and countBack=5 returns 5 data points: 05-05, 02-05, 01-05, 30-04, 29-04 (skipping weekends/holidays).\n  Maximum 250.\n\nResponse fields:\n- ticker: The requested symbol\n- data: Array of OHLCV bars sorted by date ascending\n- data[].open: Opening price (adjusted for splits/dividends for stocks, index points for indices)\n- data[].high: Highest price/index in the period\n- data[].low: Lowest price/index in the period\n- data[].close: Closing price/index (adjusted)\n- data[].volume: Total matched volume in shares\n- data[].tradingDate: Trading date in ISO 8601 format (e.g. \"2024-01-02T00:00:00.000Z\")\n",
        "parameters": [
          {
            "name": "type",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "stock",
                "index"
              ],
              "description": "Instrument type: stock (equities), index (market indices)"
            }
          },
          {
            "name": "ticker",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 10,
              "description": "Symbol code. Examples: TCB, VCB, FPT (stock); VNINDEX, VN30, HNXINDEX, HNX30, UPCOM, MID, 100, ALL, SML, XALL, X50, SI (index)"
            }
          },
          {
            "name": "resolution",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "D",
                "W",
                "M"
              ],
              "description": "Time resolution per bar: D = Daily, W = Weekly, M = Monthly"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1.0,
              "description": "End date as Unix timestamp in seconds, rounded to the start of the day (inclusive). Example: 1777939200 = 05-05-2026"
            }
          },
          {
            "name": "countBack",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "maximum": 250.0,
              "minimum": 1.0,
              "description": "Number of candles/bars to return going BACKWARDS from the `to` date. Example: countBack=5 returns 5 candles ending at `to` date (skipping weekends/holidays). Maximum 250."
            }
          }
        ],
        "responses": {
          "200": {
            "description": "MCP tool result",
