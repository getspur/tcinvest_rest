                      "type": "string"
                    },
                    "rows": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "payload": {
                            "type": "string",
                            "description": "JSON object for one result row"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/tools/tcinvest-getStockSameIndustry": {
      "get": {
        "operationId": "get_stock_same_industry",
        "summary": "This API returns a list of stocks operating in the same industry as the specified ticker. It provides comprehensive comparison metrics including financial ratios, market performance, and correlation data to help investors identify sector peers and make relative investment decisions.\nCrucial: All rating scores use a scale of 1.0 to 5.0\n\nResponse fields:\n- value: Array containing list of same-industry stocks\n- ticker: Stock symbol of the peer company\n- companyName: Full company name in Vietnamese\n- industryName: Industry classification name\n- exchangeName: Stock exchange name (HOSE, HNX, UPCOM)\n- stockRating: Internal stock rating score for investment attractiveness\n- marketCap: Market capitalization in billion VND\n- pe: Price-to-Earnings ratio (times) for valuation comparison\n- pb: Price-to-Book ratio (times) for book value assessment\n- roe: Return on Equity as ratio (display multiply by 100 and add %) measuring profitability efficiency\n- correlation: Correlation coefficient with the reference stock (-1 to 1)\n- beta: Beta coefficient measuring volatility relative to market\n- vni1m: 1-month performance relative to VN-Index as ratio (display multiply by 100 and add %)\n- vni3m: 3-month performance relative to VN-Index as ratio (display multiply by 100 and add %)\n- vni6m: 6-month performance relative to VN-Index as ratio (display multiply by 100 and add %)\n- countHolding: Number of institutional/fund holdings (persons)\n- percentHoling: Percentage of institutional ownership as ratio (display multiply by 100 and add %)\n",
        "parameters": [
          {
            "name": "ticker",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "MCP tool result",
