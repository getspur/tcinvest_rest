    "/tools/tcinvest-getIndustryIndex": {
      "get": {
        "operationId": "get_industry_index",
        "summary": "This API provides industry index time series data showing index value and trading volume at each time point. Used for charting industry index movements (prism), flows throughout the trading day.\n\nIMPORTANT - Usage guidance:\n- When user asks about \"chỉ số ngành\" (industry index/indicator), \"biến động ngành\" (industry movement), or \"giá ngành\" (industry price), use ONLY this API (getIndustryIndex).\n- Do NOT call getIncomeStatementIndustryForBank, getFinancialRatioIndustryForBank, or getBalanceSheetIndustryForBank unless user explicitly asks for financial metrics like ROE, NIM, profit, revenue, or balance sheet data.\n- For market breadth/sentiment of an industry, use getMarketBreadth.\n- For top contributing stocks in an industry, use getMarketLeader.\n- For foreign investor flow in an industry, use getMarketForeignVal.\n- For money flow intensity, use getFlowMarketValuePercentTrading.\n- For cash flow index comparison across industries, use getFiTimeSeries.\n- For heat-map visualization data, use getMarketVolatility.\n\nPARAMETER CONSTRAINT:\n- If exchange is a market index (HOSE, HNX, UPCOM, VN30, HNX30), then industry MUST be \"ALL\".\n- If industry is an ICB L2 code (e.g. 8600, 0500, 8300), then exchange MUST be \"ALL\".\n- exchange and industry cannot both be specific values at the same time; one of them must always be \"ALL\".\n\nKey response fields:\n- exchange: Exchange code queried\n- industry: Industry code queried\n- referencePrice: Reference price level (draws horizontal reference line on chart)\n- data[].i: Index value at time point (points)\n- data[].v: Trading volume at time point (shares)\n- data[].s: Timestamp in dd/MM/yyyy format\n",
        "parameters": [
          {
            "name": "exchange",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "description": "Exchange/index code: HOSE, HNX, UPCOM, VN30 or ICB L2 industry code. MUST be 'ALL' when industry is an ICB L2 code (e.g. 8600, 0500). If exchange is a market index (HOSE, HNX, UPCOM, VN30), then industry MUST be 'ALL'."
            }
          },
          {
            "name": "industry",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "description": "ICB Level 2 industry code (e.g. 8600, 0500, 8300). MUST be 'ALL' when exchange is a market index (HOSE, HNX, UPCOM, VN30). If industry is an ICB L2 code, then exchange MUST be 'ALL'."
            }
          }
        ],
        "responses": {
          "200": {
            "description": "MCP tool result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "type": "boolean"
                    },
                    "tool": {
                      "type": "string"
                    },
                    "rows": {
                      "type": "array",
                      "items": {
