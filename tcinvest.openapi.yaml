    "/tools/tcinvest-getTickerOverview": {
      "get": {
        "operationId": "get_ticker_overview",
        "summary": "The API returns 22 detailed information fields including ticker symbol, exchange, company details, industry classification, financial metrics, and ownership structure to support investment analysis and market research.\nCrucial: All rating scores use a scale of 1.0 to 5.0\n\nResponse fields:\n- ticker: Unique stock symbol identifier on the exchange\n- exchange: Trading exchange where the stock is listed (HOSE, HNX, UPCOM)\n- shortName: Company's abbreviated or commercial name\n- industryID: Legacy industry code (deprecated, not recommended for use)\n- industryIDv2: New industry code based on updated classification system\n- industryIdLevel2: Industry code by level 2 classification (major industry group)\n- industryIdLevel4: Industry code by level 4 classification (specific detailed industry)\n- industry: Industry name in Vietnamese\n- industryEn: Industry name in English\n- establishedYear: Company establishment year\n- noEmployees: Current total number of company employees (persons)\n- noShareholders: Total number of shareholders owning company stock (persons)\n- foreignPercent: Foreign investor ownership percentage as ratio (display multiply by 100 and add %) (0-1)\n- website: Company's official website address\n- stockRating: Stock rating score based on internal evaluation scale\n- deltaInWeek: Stock price change rate in the most recent week\n- deltaInMonth: Stock price change rate in the most recent month\n- deltaInYear: Stock price change rate in the most recent year\n- outstandingShare: Number of shares outstanding in the market (millions of shares)\n- issueShare: Total number of shares issued and listed (millions of shares)\n- companyType: Business entity type code (NH=Bank, BH=Insurance, CK=Securities, etc.)\n- industryIdLevel2: Industry code by level 2 classification (major industry group)\n- industryIdLevel4: Industry code by level 4 classification (specific detailed industry)\n- industry: Industry name in Vietnamese\n- industryEn: Industry name in English\n- establishedYear: Company establishment year\n- noEmployees: Current total number of company employees\n- noShareholders: Total number of shareholders owning company stock\n- foreignPercent: Foreign investor ownership percentage (0-1)\n- website: Company's official website address\n- stockRating: Stock rating score based on internal evaluation scale\n- deltaInWeek: Stock price change rate in the most recent week\n- deltaInMonth: Stock price change rate in the most recent month\n- deltaInYear: Stock price change rate in the most recent year\n- outstandingShare: Number of shares outstanding in the market (millions of shares)\n- issueShare: Total number of shares issued and listed (millions of shares)\n- companyType: Business entity type code (NH=Bank, BH=Insurance, CK=Securities, etc.) symbol identifier on the exchange\n- exchange: Trading exchange where the stock is listed (HOSE, HNX, UPCOM)\n- shortName: Company's abbreviated or commercial name\n- industryID: Legacy industry code (deprecated, not recommended for use)\n- industryIDv2: New industry code based on updated classification system\n- industryIdLevel2: Industry code by level 2 classification (major industry group)\n- industryIdLevel4: Industry code by level 4 classification (specific detailed industry)\n- industry: Industry name in Vietnamese\n- industryEn: Industry name in English\n- establishedYear: Company establishment year\n- noEmployees: Current total number of company employees\n- noShareholders: Total number of shareholders owning company stock\n- foreignPercent: Foreign investor ownership percentage (0-1)\n- website: Company's official website address\n- stockRating: Stock rating score based on internal evaluation scale\n- deltaInWeek: Stock price change rate in the most recent week\n- deltaInMonth: Stock price change rate in the most recent month\n- deltaInYear: Stock price change rate in the most recent year\n- outstandingShare: Number of shares outstanding in the market (millions of shares)\n- issueShare: Total number of shares issued and listed (millions of shares)\n- companyType: Business entity type code (NH=Bank, BH=Insurance, CK=Securities, etc.)\n\nThis API serves investment analysis, market research, and provides comprehensive insights about a listed company to support investment decision-making.\n",
