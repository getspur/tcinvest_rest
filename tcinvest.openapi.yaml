    "/tools/tcinvest-getGaugeChart": {
      "get": {
        "operationId": "get_gauge_chart",
        "summary": "Returns a comprehensive technical analysis summary for a stock ticker, combining 12 technical indicators, 6 SMA lines, and 6 EMA lines into a single gauge signal.\n\nQuery parameter:\n- period: Analysis timeframe. Valid values: 1m, 5m, 15m, 30m, 1h, D (daily, default), W (weekly).\n\nResponse structure:\n- indicator: 12 technical indicators (RSI, Stochastic %K, Stochastic RSI, MACD, MACD Histogram, ADX, Williams %R, CCI, ROC, Parabolic SAR, Ultimate Oscillator, Bollinger Band Width). Each has value (numeric) and signal (Buy/Sell/Neutral).\n- indicator.signal: Aggregated count of Buy/Sell/Neutral from the 12 indicators. sell is negative (e.g. -10 means 10 Sell signals).\n- simple: 6 Simple Moving Averages (SMA) for periods 5, 10, 20, 50, 100, 200. Signal is Buy if Close > SMA, Sell if Close < SMA.\n- simple.signal: Aggregated count from 6 SMA lines.\n- exponential: 6 Exponential Moving Averages (EMA), same periods and logic as SMA.\n- exponential.signal: Aggregated count from 6 EMA lines.\n- average: Combined SMA + EMA signals (12 total moving average signals).\n- summary: Grand total of all 24 signals (12 indicators + 12 moving averages).\n\nSignal interpretation for aggregated fields (signal.signal, average.signal, summary.signal):\n- Strong Buy: action >= 3/5 * available\n- Buy: 1/5 * available <= action < 3/5 * available\n- Neutral: -1/5 * available <= action < 1/5 * available\n- Sell: -3/5 * available <= action < -1/5 * available\n- Strong Sell: action < -3/5 * available\nwhere action = buy - sell, available = buy + sell + neutral.\n",
        "parameters": [
          {
            "name": "ticker",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "description": "Stock ticker symbol (e.g. TCB, VCB, FPT, MSN)"
            }
          },
          {
            "name": "period",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
