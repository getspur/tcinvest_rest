    "/tools/tcinvest-getRsRating": {
      "get": {
        "operationId": "get_rs_rating",
        "summary": "This API provides Relative Strength (RS) Rating time series data for a stock across multiple timeframes (3 days, 1 month, 3 months, 1 year, and composite). RS Rating measures a stock's price performance relative to the overall market.\n\nKey response fields:\n- data[].tradingDate: Trading date in ISO 8601 format (yyyy-MM-dd'T'HH:mm:ss.SSSXXX)\n- data[].v3D: RS Rating 3-day (rounded 1 decimal)\n- data[].v1M: RS Rating 1-month (rounded 1 decimal)\n- data[].v3M: RS Rating 3-month (rounded 1 decimal)\n- data[].v1Y: RS Rating 1-year (rounded 1 decimal)\n- data[].vTC: RS Rating composite/total (rounded 1 decimal)\n\nNotes:\n- countBack maximum is 250\n- RS Rating values are rounded to 1 decimal place\n",
        "parameters": [
          {
            "name": "ticker",
