        "operationId": "get_market_volatility",
        "summary": "This API provides heat-map data including price volatility, trading volume, foreign trading, market capitalization, RS rating, and technical signals for each stock. Used for rendering market heat-map visualizations.\n\nPARAMETER CONSTRAINT:\n- If exchange is a market index (HOSE, HNX, UPCOM, VN30, HNX30), then industrys MUST be \"ALL\".\n- If industrys contains ICB L2 codes (e.g. 8600, 0500, 8300), then exchange MUST be \"ALL\".\n- exchange and industrys cannot both be specific values at the same time; one of them must always be \"ALL\".\n\nKey response fields (industry level - data[]):\n- data[].e: Exchange code\n- data[].i: Industry code\n- data[].ii: Industry index value (points)\n- data[].ic: Industry index change percentage (e.g. -2.33 = down 2.33%)\n- data[].mc: Total industry market cap in VND\n- data[].vol: Total industry trading volume (shares)\n- data[].val: Total industry trading value in VND\n- data[].fvol: Foreign net volume (positive = net buy, negative = net sell)\n- data[].fval: Foreign net trading value in VND\n- data[].s: Unix timestamp (epoch seconds)\n\nKey response fields (stock level - data[].data[]):\n- t: Ticker symbol\n- pc: Price change percentage (determines heat-map cell color)\n- vol: Trading volume (shares)\n- val: Trading value in VND\n- mc: Market capitalization in VND (determines heat-map cell size)\n- fvol/fval: Foreign trading volume/value\n- ob: Order book ratio (bid/total, >0.5 means more bids than asks)\n- bp: Buy pressure (0-1)\n- rsi14: RSI 14-day indicator (0-100)\n- rs3/avgrs: Relative Strength 3M / Average\n- p: Current price in VND\n- pPerMa5/pPerMa20: Price vs MA5/MA20 percentage\n",
