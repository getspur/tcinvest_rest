                    "ok": {
                      "type": "boolean"
                    },
                    "tool": {
                      "type": "string"
                    },
                    "rows": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "payload": {
                            "type": "string",
                            "description": "JSON object for one result row"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
