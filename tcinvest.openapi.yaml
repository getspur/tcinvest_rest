    "/tools/tcinvest-getPriceVolatility": {
      "get": {
        "operationId": "get_price_volatility",
        "summary": "This API provides comprehensive price volatility analysis for a specific stock ticker. It returns the highest and lowest prices recorded within the past year along with percentage changes relative to current price. The data helps investors understand price range boundaries and current position within that range for risk assessment and trading decisions.\n\nResponse fields:\n- ticker: Stock symbol identifier\n- highestPrice: Maximum price reached within the past 12 months in VND\n- lowestPrice: Minimum price reached within the past 12 months in VND\n- highestPricePercent: Percentage change from current price to highest price as ratio (display multiply by 100 and add %) (negative indicates current price is below peak)\n- lowestPricePercent: Percentage change from current price to lowest price as ratio (display multiply by 100 and add %) (positive indicates current price is above bottom)\n",
        "parameters": [
          {
            "name": "ticker",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "MCP tool result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "type": "boolean"
                    },
                    "tool": {
                      "type": "string"
                    },
                    "rows": {
                      "type": "array",
                      "items": {
