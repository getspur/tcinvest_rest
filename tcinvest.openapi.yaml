{
  "openapi": "3.0.3",
  "info": {
    "title": "tcinvest REST",
    "version": "0.1.0",
    "description": "REST facade over the tcinvest MCP server."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8788"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "summary": "Liveness",
        "responses": {
          "200": {
            "description": "ok"
          }
        }
      }
    },
    "/tools": {
      "get": {
        "operationId": "list_tools",
        "summary": "List tcinvest MCP tools",
        "responses": {
          "200": {
            "description": "tool catalog",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "tools": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "path": {
                            "type": "string"
                          },
                          "description": {
                            "type": "string"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/tools/tcinvest-getStockRatio": {
      "get": {
        "operationId": "get_stock_ratio",
        "summary": "This API provides essential financial indicators and ratios for comprehensive stock analysis. It includes valuation metrics, profitability ratios, efficiency measures, and banking-specific indicators for financial institutions.\n\nResponse fields:\n- ticker: Stock symbol identifier\n- capitalize: Market capitalization in billion VND\n- tradeVolume: Trading volume in shares\n- priceToEarning: Price-to-Earnings ratio (times) indicating stock valuation relative to earnings\n- priceToBook: Price-to-Book ratio (times) showing market value versus book value\n- valueBeforeEbitda: Enterprise Value to EBITDA ratio (times) (null for banks)\n- dividend: Dividend yield as ratio (display multiply by 100 and add %) (0.000 means no dividend)\n- roe: Return on Equity as ratio (display multiply by 100 and add %) measuring profitability efficiency\n- profitGrowthAvarage: Average profit growth rate over 5 years as ratio (display multiply by 100 and add %)\n- ageOfReceivable: Days sales outstanding in days (null for banks)\n- ageOfInventory: Inventory turnover in days (null for banks)\n- payableOnEquity: Debt-to-Equity ratio (times) (null for banks)\n- payableOnEbitda: Debt-to-EBITDA ratio (times) (null for banks)\n- ebitOnInterest: EBIT to Interest coverage ratio (times) (null for banks)\n- shortOnLongTermPayable: Short-term to long-term debt ratio (times) (null for banks)\n- revenue: Total revenue in billion VND\n- operationProfit: Operating profit in billion VND\n- netProfit: Net profit after tax in billion VND\n- earningPerShare: Earnings per share in VND\n- asset: Total assets in billion VND\n- liability: Total liabilities in billion VND\n- equity: Shareholders' equity in billion VND\n- bookValuePerShare: Book value per share in VND\n- profitMargin: Net profit margin as ratio (display multiply by 100 and add %)\n- nonInterestOnToi: Non-interest income to total operating income ratio (times) (banking)\n- loanOnDeposit: Loan-to-deposit ratio (times) (banking)\n- creditGrowth: Credit growth rate as ratio (display multiply by 100 and add %) (banking)\n- badDebtPercentage: Non-performing loan ratio as ratio (display multiply by 100 and add %) (banking)\n- provisionOnBadDebt: Provision coverage ratio for bad debts (times) (banking)\n- customerCredit: Total customer loans in billion VND (banking)\n- betaIndex: Beta coefficient measuring stock volatility relative to market\n",
        "parameters": [
          {
            "name": "ticker",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "MCP tool result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "type": "boolean"
                    },
                    "tool": {
                      "type": "string"
                    },
                    "rows": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "payload": {
                            "type": "string",
                            "description": "JSON object for one result row"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "get_stock_ratio_post",
        "summary": "This API provides essential financial indicators and ratios for comprehensive stock analysis. It includes valuation metrics, profitability ratios, efficiency measures, and banking-specific indicators for financial institutions.\n\nResponse fields:\n- ticker: Stock symbol identifier\n- capitalize: Market capitalization in billion VND\n- tradeVolume: Trading volume in shares\n- priceToEarning: Price-to-Earnings ratio (times) indicating stock valuation relative to earnings\n- priceToBook: Price-to-Book ratio (times) showing market value versus book value\n- valueBeforeEbitda: Enterprise Value to EBITDA ratio (times) (null for banks)\n- dividend: Dividend yield as ratio (display multiply by 100 and add %) (0.000 means no dividend)\n- roe: Return on Equity as ratio (display multiply by 100 and add %) measuring profitability efficiency\n- profitGrowthAvarage: Average profit growth rate over 5 years as ratio (display multiply by 100 and add %)\n- ageOfReceivable: Days sales outstanding in days (null for banks)\n- ageOfInventory: Inventory turnover in days (null for banks)\n- payableOnEquity: Debt-to-Equity ratio (times) (null for banks)\n- payableOnEbitda: Debt-to-EBITDA ratio (times) (null for banks)\n- ebitOnInterest: EBIT to Interest coverage ratio (times) (null for banks)\n- shortOnLongTermPayable: Short-term to long-term debt ratio (times) (null for banks)\n- revenue: Total revenue in billion VND\n- operationProfit: Operating profit in billion VND\n- netProfit: Net profit after tax in billion VND\n- earningPerShare: Earnings per share in VND\n- asset: Total assets in billion VND\n- liability: Total liabilities in billion VND\n- equity: Shareholders' equity in billion VND\n- bookValuePerShare: Book value per share in VND\n- profitMargin: Net profit margin as ratio (display multiply by 100 and add %)\n- nonInterestOnToi: Non-interest income to total operating income ratio (times) (banking)\n- loanOnDeposit: Loan-to-deposit ratio (times) (banking)\n- creditGrowth: Credit growth rate as ratio (display multiply by 100 and add %) (banking)\n- badDebtPercentage: Non-performing loan ratio as ratio (display multiply by 100 and add %) (banking)\n- provisionOnBadDebt: Provision coverage ratio for bad debts (times) (banking)\n- customerCredit: Total customer loans in billion VND (banking)\n- betaIndex: Beta coefficient measuring stock volatility relative to market\n",
        "requestBody": {
          "required": true,
          "content": {
